# Q-Chem: inputs and job execution are generated by ngeoopt. Built-in output
# parsing is not implemented yet, so the energy is read with a regex here.
task: optimize
molecule:
  xyz: ../pyscf_water/water.xyz
backend:
  name: qchem
  rem:
    method: b3lyp
    basis: 6-31g*
    scf_convergence: 10
    sym_ignore: true
  energy_regex: 'Total energy in the final basis set =\s+(\S+)'
  success_regex: 'Thank you very much'
parallel:
  workers: 4
  threads_per_worker: 4  # qchem -nt 4 for each of the 4 concurrent jobs
