# Q-Chem S1 optimization of butadiene with MRSF-TDDFT (BHHLYP/cc-pVDZ).
# Outputs are read by ngeoopt's built-in Q-Chem parser (SCF, TDDFT/TDA/CIS, SF, MRSF).
task: optimize
molecule:
  xyz: butadiene.xyz
  multiplicity: 3                # ROHF triplet reference for MRSF
backend:
  name: qchem
  rem:
    jobtype: sp
    method: bhhlyp
    basis: cc-pvdz
    unrestricted: false
    spin_flip: 2                 # MRSF
    cis_n_roots: 6
    cis_singlets: true
    cis_triplets: false
    scf_convergence: 10
    cis_convergence: 8
    max_cis_cycles: 250
    xc_grid: 3
    # state_analysis: true       # adds hole/electron populations to the tracking evidence
  # sym_ignore is added automatically
state:
  root: 1                        # 0 = S0 (lowest MRSF singlet), 1 = S1
  multiplicity: 1
gradient:
  scheme: central                # step defaults to 0.01 Bohr for Q-Chem (8-decimal energies)
parallel:
  workers: 4
  threads_per_worker: 4          # qchem -nt 4 for each of 4 concurrent jobs
