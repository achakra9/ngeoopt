# Any Python energy: a Morse cluster
task: optimize
molecule:
  geometry: |
    X 0.0 0.0 0.0
    X 1.1 0.05 0.0
    X 0.5 0.9 0.1
backend:
  name: function
  function: mypotential.py:morse   # or mypotential.py:torch_model with device: mps
  kwargs: {De: 0.17, re: 1.8}
gradient:
  scheme: central4
parallel:
  executor: serial
