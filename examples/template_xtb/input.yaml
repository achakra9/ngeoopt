# Any program: GFN2-xTB through the generic template backend
task: optimize
molecule:
  xyz: ../pyscf_water/water.xyz
backend:
  name: template
  template: |
    {{natoms}}
    {{label}}
    {{geometry}}
  input_name: job.xyz
  output_name: job.out
  command: "xtb {input} --sp --gfn 2 --chrg 0 > {output} 2>&1"
  energy_regex: 'TOTAL ENERGY\s+(\S+)\s+Eh'
  env:
    OMP_STACKSIZE: 1G
parallel:
  workers: auto
