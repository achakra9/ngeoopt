# A harder case: S1 of twisted ethylene with SF-CISd (no analytic gradients in exkit).
# Inline exkit keywords; SCF guess from the centre keeps the open-shell reference stable.
# The two zwitterionic singlets are nearly degenerate and swap order on the way down.
#   ngeoopt run sf_cisd_twisted.yaml
task: optimize

molecule:
  geometry: |
    C   0.000000   0.000000   0.667000
    C   0.000000   0.000000  -0.667000
    H   0.000000   0.923000   1.238000
    H   0.000000  -0.923000   1.238000
    H   0.923000   0.000000  -1.238000
    H  -0.923000   0.000000  -1.238000
  multiplicity: 3

backend:
  name: exkit
  input:
    method: sf-cisd
    basis: 6-31g*
    nstates: 6
    act_occ: 2
    act_virt: 2

state:
  root: 1
  multiplicity: 1
  method: auto                 # composite score; SF-CISd has no overlap signature (its
                               # near-degenerate states share their singles), so <S^2>,
                               # predicted energy and root number decide
  s2_max_change: 0.3

gradient:
  scheme: central
  step: 0.005

optimizer:
  trust_radius: 0.2
  convergence: gaussian

parallel:
  workers: auto
